<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>I-GUIDE AI — Chat</title>
<style>
  :root{
    --bg:#ffffff; --panel:#ffffff; --ink:#1f2328; --muted:#6b7280; --line:#e6e7e9;
    --soft:#f4f5f6; --soft2:#eceef0; --brand:#1aa37a; --link:#1f7a4d;
    --user-a:#4e9a51; --user-b:#a8b400; --shadow:0 1px 3px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.05);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:#fbfbfa; color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:16px; line-height:1.6;
    display:flex; flex-direction:column; min-height:100vh;
  }
  a{color:var(--link)}
  /* ---------- header ---------- */
  header.bar{position:sticky;top:0;z-index:30;padding:14px 18px}
  .bar-inner{
    max-width:1280px;margin:0 auto;background:#fff;border:1px solid var(--line);
    border-radius:18px;box-shadow:var(--shadow);
    display:flex;align-items:center;gap:22px;padding:10px 18px;
  }
  .brand{display:flex;align-items:center;gap:10px;font-weight:600}
  .brand-link{display:inline-flex;align-items:center;text-decoration:none;border-radius:10px;padding:3px;transition:background .12s ease}
  .brand-link:hover{background:var(--soft)}
  .iglogo path{fill:none;stroke-width:11;stroke-linecap:round;stroke-linejoin:round}
  img.iglogo{height:32px;width:auto;display:block}
  .ic{flex:0 0 auto;vertical-align:middle}
  .iconbtn{display:inline-flex;align-items:center;justify-content:center}
  .search svg,.conn summary svg{vertical-align:-3px;margin-right:3px}
  .bubble.user .att .chip{display:inline-flex;align-items:center;gap:6px}
  nav.top{display:flex;gap:22px;align-items:center;font-weight:600;color:#2b2f36}
  nav.top span{display:inline-flex;align-items:center;gap:5px;cursor:default;white-space:nowrap}
  nav.top .caret{color:#9aa0a6;font-size:12px}
  .grow{flex:1}
  .search{display:flex;align-items:center;gap:8px;background:#f1f2f3;border-radius:999px;padding:8px 14px;color:#9aa0a6;min-width:200px}
  .search input{border:0;background:transparent;outline:0;color:var(--ink);width:100%;font-size:14px}
  .avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#7a8b3a,#c9b15a);border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
  .jpy{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:11px;color:#f37726;font-weight:700}
  @media (max-width:880px){nav.top,.search{display:none}}

  /* ---------- conversation ---------- */
  main{flex:1;width:100%;max-width:980px;margin:0 auto;padding:8px 20px 150px;width:100%}
  .turn{margin:26px 0}
  .who{font-size:13px;color:var(--muted);margin:0 2px 6px}
  .who.you{text-align:right}
  .row{display:flex;gap:12px;align-items:flex-start}
  .row.right{justify-content:flex-end}
  .bubble.user{
    max-width:72%;background:linear-gradient(100deg,var(--user-a),var(--user-b));
    color:#fff;padding:14px 18px;border-radius:16px 16px 4px 16px;box-shadow:var(--shadow);
    font-size:16px;white-space:pre-wrap;word-break:break-word;
  }
  .bubble.user .att{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
  .bubble.user .att .chip{background:rgba(255,255,255,.22);color:#fff;border-radius:999px;padding:2px 10px;font-size:12px}
  .logo{flex:0 0 auto;width:34px;height:34px;margin-top:2px}
  .ai-col{flex:1;min-width:0}
  .ai-label{font-size:12px;letter-spacing:.06em;color:#9aa0a6;font-weight:600;margin-bottom:6px}

  /* reasoning accordion */
  .reason{border:1px solid var(--line);border-radius:14px;background:var(--soft);overflow:hidden;margin-bottom:12px}
  .reason summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:14px 16px;font-weight:600;color:#3b4046}
  .reason summary::-webkit-details-marker{display:none}
  .reason .chev{margin-left:auto;color:#9aa0a6;transition:transform .15s ease}
  .reason[open] .chev{transform:rotate(180deg)}
  .reason .body{padding:4px 18px 16px;border-top:1px solid var(--line)}
  .reason .body .ln{color:#5b6168;font-size:14.5px;padding:3px 0}
  .reason .body .ln::before{content:"– ";color:#b7bcc2}
  /* search activity in the reasoning log: the call, what it returned, and refusals */
  .reason .body .ln.tool{color:#3b4046;font-weight:600}
  .reason .body .ln.tool::before{content:"→ ";color:#7a8b3a}
  .reason .body .ln.hit{color:#5b6168;padding-left:16px;font-size:14px}
  .reason .body .ln.hit::before{content:"✓ ";color:#7a8b3a}
  .reason .body .ln.miss{color:#8a6d3b;padding-left:16px;font-size:14px}
  .reason .body .ln.miss::before{content:"∅ ";color:#c9a227}
  .reason .body .ln.warn{color:#a4453a;padding-left:16px;font-size:14px}
  .reason .body .ln.warn::before{content:"! ";color:#a4453a}
  .reason .body .ln.doc{color:#6b7178;padding-left:34px;font-size:13.5px}
  .reason .body .ln.doc::before{content:"· ";color:#b7bcc2}
  .reason .body .ln.doc a{color:#4a6a8a}
  .reason .body .ln.retry{color:#7a5c9e;font-weight:600}
  .reason .body .ln.retry::before{content:"↻ ";color:#7a5c9e}
  .reason .tally{margin-left:8px;font-weight:500;color:#8a9099;font-size:13px}
  .reason .body .ln.think{color:#6b6478;font-style:italic;padding-left:16px;font-size:13.5px}
  .reason .body .ln.think::before{content:"“";color:#b7bcc2;font-style:normal}
  .reason .body .ln.route{color:#3b4046;font-weight:600}
  .reason .body .ln.route::before{content:"⇢ ";color:#7a8b3a}
  .conn .chk{display:flex;align-items:center;gap:7px;font-size:13px;color:#5b6168;font-weight:400;text-transform:none;letter-spacing:0}
  .conn .chk input{width:14px;height:14px}

  /* sources block under the answer */
  .srcs{margin-top:18px;border-top:1px solid var(--line);padding-top:14px}
  .srcs h4{margin:0 0 4px;font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:#9aa0a6}
  .srcs .grp{margin-top:12px}
  .srcs .grp>.hd{font-size:13px;font-weight:700;color:#5b6168;display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .srcs .grp>.hd .n{font-weight:500;color:#9aa0a6}
  .srcs .it{padding:7px 0;border-top:1px dashed var(--line)}
  .srcs .it:first-of-type{border-top:0}
  .srcs .it .t{font-size:14.5px;font-weight:600;color:#2f3437;word-break:break-word}
  .srcs .it .t a{color:#3f6591;text-decoration:none}
  .srcs .it .t a:hover{text-decoration:underline}
  .srcs .it .sn{font-size:13.5px;color:#6b7178;margin-top:2px;line-height:1.45}
  .srcs .it .meta{font-size:12px;color:#9aa0a6;margin-top:3px;display:flex;flex-wrap:wrap;gap:8px}
  .srcs .it .meta .b{background:#f1f2f3;border-radius:999px;padding:1px 8px}
  .srcs .it .meta .b.web{background:#eef4ea;color:#5d7238}
  .srcs .it .meta .b.ext{background:#eef1f6;color:#41577a}
  .spin{width:16px;height:16px;border-radius:50%;border:2px solid #cdd3da;border-top-color:var(--brand);animation:sp .8s linear infinite;flex:0 0 auto}
  .spin.hidden{display:none}
  @keyframes sp{to{transform:rotate(360deg)}}

  /* answer card */
  .answer-card{border:1px solid var(--line);border-radius:14px;background:#fff;box-shadow:var(--shadow);padding:6px 20px 16px}
  .files{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .files a{display:inline-flex;align-items:center;gap:7px;background:#eef6f0;border:1px solid #d6e7db;color:var(--link);
    text-decoration:none;border-radius:10px;padding:7px 12px;font-size:14px}
  .files a:hover{background:#e4f0e8}
  .feedback{border-top:1px solid var(--line);margin-top:14px;padding-top:12px;color:#4b5158}
  .feedback .q{display:flex;align-items:center;gap:12px;font-size:15px}
  .iconbtn{border:0;background:transparent;cursor:pointer;font-size:18px;line-height:1;padding:4px;border-radius:8px;color:#6b7280}
  .iconbtn:hover{background:var(--soft2)}
  .iconbtn.on{color:var(--brand)}
  .more{margin-top:8px}
  .more summary{cursor:pointer;color:var(--muted);font-size:14px;list-style:none;display:flex;align-items:center;gap:6px}
  .more summary::-webkit-details-marker{display:none}
  .more textarea{width:100%;margin-top:8px;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;resize:vertical;min-height:64px}

  .err{color:#b42318;background:#fdf3f2;border:1px solid #f4c9c4;border-radius:12px;padding:12px 16px}

  /* markdown */
  .md p{margin:.5em 0}
  .md h1,.md h2,.md h3{font-weight:600;margin:.7em 0 .35em;line-height:1.3}
  .md h1{font-size:1.4em}.md h2{font-size:1.2em}.md h3{font-size:1.05em}
  .md ul,.md ol{margin:.4em 0;padding-left:1.4em}.md li{margin:.15em 0}
  .md code{background:var(--soft2);padding:.1em .35em;border-radius:5px;font-size:.9em}
  .md pre{background:#0f172a;color:#e2e8f0;padding:14px 16px;border-radius:10px;overflow:auto}
  .md pre code{background:transparent;color:inherit;padding:0}
  .md table{border-collapse:collapse;margin:.5em 0;font-size:.95em}
  .md th,.md td{border:1px solid var(--line);padding:6px 10px;text-align:left}
  .md blockquote{border-left:3px solid var(--line);margin:.5em 0;padding:.1em 0 .1em 12px;color:var(--muted)}
  .md a{word-break:break-word}
  .md img{display:block;max-width:100%;height:auto;margin:.6em 0;border:1px solid var(--line);border-radius:10px;background:#fff}

  /* image artifacts rendered inline (plots, maps, figures) */
  .art-imgs{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px}
  .art-imgs:empty{display:none}
  .art{margin:0;max-width:440px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;box-shadow:var(--shadow)}
  .art > a{display:block}
  .art img{display:block;width:100%;height:auto}
  .art figcaption{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;font-size:13px;color:var(--muted);border-top:1px solid var(--line)}
  .art figcaption .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .art figcaption a.dl{display:inline-flex;align-items:center;gap:5px;color:var(--link);text-decoration:none;flex:0 0 auto}
  .art figcaption a.dl:hover{text-decoration:underline}

  /* ---------- composer ---------- */
  .composer-wrap{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(180deg,rgba(251,251,250,0),#fbfbfa 38%);padding:14px 20px 10px}
  .composer{max-width:980px;margin:0 auto}
  .attbar{display:flex;flex-wrap:wrap;gap:8px;margin:0 6px 8px}
  .attbar .chip{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px 6px 5px 12px;font-size:13px;color:#3b4046;box-shadow:var(--shadow)}
  .attbar .chip button{border:0;background:transparent;cursor:pointer;color:#9aa0a6;font-size:15px;line-height:1;padding:2px 4px;border-radius:50%}
  .attbar .chip button:hover{background:var(--soft2);color:#444}
  .box{display:flex;align-items:flex-end;gap:8px;background:#fff;border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow);padding:8px 8px 8px 8px}
  .box textarea{flex:1;border:0;outline:0;resize:none;font:inherit;font-size:16px;line-height:1.5;max-height:180px;padding:9px 4px;background:transparent;color:var(--ink)}
  .circle{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:#fff;color:#5b6168;display:grid;place-items:center;cursor:pointer;flex:0 0 auto}
  .circle:hover{background:var(--soft)}
  .circle svg{width:20px;height:20px}
  .send{background:var(--brand);border-color:var(--brand);color:#fff}
  .send:hover{filter:brightness(1.05)}
  .send:disabled{background:#cdd3da;border-color:#cdd3da;cursor:default}
  .send .spin{border-color:rgba(255,255,255,.45);border-top-color:#fff}
  .foot{max-width:980px;margin:8px auto 0;text-align:center;color:#9aa0a6;font-size:12.5px}
  .foot a{color:#9aa0a6}

  /* connection settings */
  .conn{max-width:980px;margin:6px auto 0}
  .conn summary{cursor:pointer;color:#9aa0a6;font-size:12.5px;list-style:none;display:inline-flex;gap:6px;align-items:center}
  .conn summary::-webkit-details-marker{display:none}
  .conn .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;margin-top:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .conn label{font-size:12px;color:var(--muted);display:block;margin-bottom:3px}
  .conn input{width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 10px;font:inherit;font-size:13px}
  @media (max-width:640px){.conn .grid{grid-template-columns:1fr}}
</style>
</head>

<script>
/* ===================== config (per spec) ===================== */
const CONFIG = {
  use_persistent_memory: false,   // OFF
  // ON. The server gates the DETAIL tier of the stream on this flag: with it off, only
  // status/node events are emitted (see _STATUS_TIER_EVENTS in agent_runtime/streaming_trace.py),
  // so tool_call/tool_result never arrive and the reasoning log can only show "Searching" and
  // "N docs in evidence" — which method ran, with what query, and what came back are all withheld
  // by the SERVER, not dropped by this page. Toggle it in the Connection panel.
  agent_dev: true,
  use_supervisor: true,
  code_exec: true,
  include_mcp_tools: true,
  smart_tool_routing: true,
  tool_strategy: "granular",
  mcp_modules: ["search_tools", "data_tools", "spatial_analysis_tools"],
  // Search methods for the agent: the four INTERNAL I-GUIDE KB methods (the neo4j companions ride
  // along automatically) PLUS the external federated `opengeodata_search` (CMR / Data.gov /
  // Socrata) for open-geodata discovery — it complements the KB (see SearchAgent rule 9), it does
  // not replace it. NOTE: send the method names, NOT `[]` — server-side a non-null empty list means
  // "none match" and strips ALL search tools; `null`/omit means "all".
  // `web_search` brings its `web_fetch` companion along automatically (server-side rule), as do
  // `agent_kb_search` -> `get_kb_block` and `kb_method_search` -> `get_method_contract`.
  //
  // `agent_kb_search` and `kb_method_search` were missing here, and this list is a HARD filter:
  // the tools were registered, allowed by tool_policy, and still never offered to the search
  // peer. Observed directly — asked for reusable Chicago-crime mapping code, the agent listed
  // "keyword_search, semantic_search, neo4j_search, spatial_search" as everything it had and
  // answered "go adapt this notebook", when `plot_choropleth_map` was sitting in the method
  // library with a working import line. Sub-document evidence and the method library are the
  // whole point of the system; leaving them out of the default made both invisible.
  enabled_search_methods: ["keyword_search", "semantic_search", "neo4j_search", "spatial_search",
                           "agent_kb_search", "kb_method_search",
                           "opengeodata_search", "web_search"],
  recent_k: 8,
};
function newSessionId(){
  try { if (window.crypto && crypto.randomUUID) return "sess-" + crypto.randomUUID(); } catch(e){}
  return "sess-" + Date.now().toString(36) + Math.random().toString(36).slice(2,10);
}
// Fresh random session id on every page open/refresh -> each load is its own isolated
// session; reused across turns within the page so the conversation keeps continuity.
let threadId = newSessionId(), memoryId = null;

/* ===================== url helpers ===================== */
function apiBase(){
  for (const id of ["endpoint","upload_endpoint"]){
    const v = String((document.getElementById(id)||{}).value||"").trim();
    if (/^https?:\/\//i.test(v)){ try { return new URL(v).origin; } catch(e){} }
  }
  return location.protocol === "file:" ? "http://127.0.0.1:3500" : location.origin;
}
function absoluteUrl(path){
  if(!path) return "#";
  let p = String(path).trim().replace(/^sandbox:/i,"");
  if(/^https?:\/\//i.test(p)) return p;
  try { return new URL(p, apiBase()).toString(); } catch(e){ return "#"; }
}
function reqUrl(id, fallback){
  const v = String((document.getElementById(id)||{}).value||"").trim();
  if(/^https?:\/\//i.test(v)) return v;
  try { return new URL(v||fallback, apiBase()).toString(); } catch(e){ return fallback; }
}
function authHeaders(json){
  const h = {}; if (json) h["Content-Type"]="application/json";
  const k = document.getElementById("api_key").value.trim();
  if (k) h["X-API-KEY"]=k;
  return h;
}

/* Auth fails CLOSED on the server: a blank key against a key-protected server is a
   403, and a server with no AGENT_CHAT_API_KEY configured is a 500. Both used to
   surface as a raw JSON body, which reads like a bug rather than a setting. */
async function describeHttpError(resp){
  const raw = await resp.text().catch(()=> "");
  let detail = raw;
  try { const j = JSON.parse(raw); detail = j.error || j.message || raw; } catch(_){}
  const keyed = !!document.getElementById("api_key").value.trim();
  if (resp.status===403)
    return keyed
      ? "403 — the API key was rejected. Check the key matches AGENT_CHAT_API_KEY on the server."
      : "403 — this server requires an API key. Enter it in the API key field above.";
  if (resp.status===500 && /misconfigur|api key not set/i.test(detail))
    return "500 — the server has no AGENT_CHAT_API_KEY configured, so it refuses requests. "
         + "Set it server-side, or set AGENT_CHAT_AUTH_OPTIONAL=1 for local development.";
  if (resp.status===0 || !resp.status)
    return "Request blocked before reaching the server — likely CORS. The server now uses an "
         + "AGENT_CORS_ORIGINS allowlist; add this page's origin to it.";
  return detail || ("HTTP " + resp.status);
}

/* png/jpg/… detection for rendering image artifacts inline */
const IMG_EXT_RE=/\.(png|jpe?g|gif|webp|svg|bmp|avif)(?:[?#].*)?$/i;
function isImageName(name){ return IMG_EXT_RE.test(String(name||"")); }

/* ===================== markdown (escape-first, XSS-safe) ===================== */
function renderMarkdown(src){
  const esc=(s)=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  // Inline rules. Code/images/links are "stashed" as  N  placeholders BEFORE the
  // bold/em rules run, so an emphasis rule can never corrupt a URL, alt text, or code that
  // happens to contain * or __ (e.g. ![a](.../my__file.png)). Placeholders are restored last.
  const inline=(s)=>{
    const stash=[];
    const hold=(html)=>{ stash.push(html); return "\uE000"+(stash.length-1)+"\uE000"; };
    const emph=(t)=>t
      .replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>")
      .replace(/__([^_]+)__/g,"<strong>$1</strong>")
      .replace(/(^|[^*])\*(?!\s)([^*]+?)\*/g,"$1<em>$2</em>");
    let out=String(s)
      .replace(/`([^`]+)`/g,(_,c)=>hold(`<code>${c}</code>`))
      .replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g,(_,alt,u)=>{  // ![alt](url) -> inline image (before the link rule)
        const href=String(u).replace(/^sandbox:/i,"");
        let safe; if(/^(https?:|data:image\/)/i.test(href)) safe=href;
        else if(href.charAt(0)==="/") safe=absoluteUrl(href); else safe="";
        if(!safe) return "";
        safe=safe.replace(/"/g,"%22");
        const a=String(alt).replace(/"/g,"&quot;");
        return hold(`<img class="md-img" src="${safe}" alt="${a}" loading="lazy">`);
      })
      .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,(_,t,u)=>{
        const href=String(u).replace(/^sandbox:/i,"");
        let safe; if(/^(https?:|mailto:)/i.test(href)) safe=href;
        else if(href.charAt(0)==="/") safe=absoluteUrl(href); else safe="#";
        safe=safe.replace(/"/g,"%22");
        return hold(`<a href="${safe}" target="_blank" rel="noopener noreferrer">${emph(t)}</a>`);
      });
    out=emph(out);  // emphasis on the remaining text only; placeholders contain no * or _
    // restore high->low: a later-stashed item (link) may embed an earlier placeholder (code/image)
    for(let k=stash.length-1;k>=0;k--){ out=out.split("\uE000"+k+"\uE000").join(stash[k]); }
    return out;
  };
  const lines=String(src||"").replace(/\r\n?/g,"\n").split("\n");
  let html="",i=0,inUl=false,inOl=false,para=[];
  const closeLists=()=>{if(inUl){html+="</ul>";inUl=false;}if(inOl){html+="</ol>";inOl=false;}};
  const flush=()=>{if(para.length){html+="<p>"+inline(esc(para.join("\n"))).replace(/\n/g,"<br>")+"</p>";para=[];}};
  const isSep=(l)=>/^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)+\|?\s*$/.test(l);
  const cells=(l)=>l.replace(/^\s*\|/,"").replace(/\|\s*$/,"").split("|").map(c=>c.trim());
  while(i<lines.length){
    const line=lines[i];
    const fence=line.match(/^```(\w*)\s*$/);
    if(fence){flush();closeLists();i++;const code=[];while(i<lines.length&&!/^```\s*$/.test(lines[i])){code.push(lines[i]);i++;}i++;html+=`<pre><code>${esc(code.join("\n"))}</code></pre>`;continue;}
    const h=line.match(/^(#{1,6})\s+(.*)$/);
    if(h){flush();closeLists();const lv=h[1].length;html+=`<h${lv}>${inline(esc(h[2]))}</h${lv}>`;i++;continue;}
    if(/^\s*([-*_])\1{2,}\s*$/.test(line)){flush();closeLists();html+="<hr>";i++;continue;}
    if(line.includes("|")&&i+1<lines.length&&isSep(lines[i+1])){flush();closeLists();const head=cells(line);i+=2;const rows=[];while(i<lines.length&&lines[i].includes("|")&&lines[i].trim()!==""){rows.push(cells(lines[i]));i++;}html+="<table><thead><tr>"+head.map(c=>`<th>${inline(esc(c))}</th>`).join("")+"</tr></thead><tbody>"+rows.map(r=>"<tr>"+r.map(c=>`<td>${inline(esc(c))}</td>`).join("")+"</tr>").join("")+"</tbody></table>";continue;}
    const bq=line.match(/^>\s?(.*)$/);
    if(bq){flush();closeLists();const q=[];while(i<lines.length){const m=lines[i].match(/^>\s?(.*)$/);if(!m)break;q.push(m[1]);i++;}html+=`<blockquote>${inline(esc(q.join("\n"))).replace(/\n/g,"<br>")}</blockquote>`;continue;}
    const ul=line.match(/^\s*[-*+]\s+(.*)$/);
    if(ul){flush();if(inOl){html+="</ol>";inOl=false;}if(!inUl){html+="<ul>";inUl=true;}html+=`<li>${inline(esc(ul[1]))}</li>`;i++;continue;}
    const ol=line.match(/^\s*\d+\.\s+(.*)$/);
    if(ol){flush();if(inUl){html+="</ul>";inUl=false;}if(!inOl){html+="<ol>";inOl=true;}html+=`<li>${inline(esc(ol[1]))}</li>`;i++;continue;}
    if(/^\s*$/.test(line)){flush();closeLists();i++;continue;}
    para.push(line);i++;
  }
  flush();closeLists();return html;
}

function addUserTurn(text, files){
  const turn=el("div","turn");
  turn.appendChild(el("div","who you","You"));
  const row=el("div","row right");
  const b=el("div","bubble user"); b.textContent=text;
  if(files && files.length){
    const att=el("div","att");
    files.forEach(f=>{const c=el("span","chip",ICONS.paperclip);c.appendChild(document.createTextNode(f.filename||f.file_id));att.appendChild(c);});
    b.appendChild(att);
  }
  row.appendChild(b); turn.appendChild(row); thread.appendChild(turn); scrollDown();
}

function addAiTurn(){
  const turn=el("div","turn");
  const row=el("div","row");
  row.innerHTML=LOGO;
  const col=el("div","ai-col");
  col.appendChild(el("div","ai-label","I-GUIDE AI"));

  const reason=el("details","reason"); reason.open=false;  // folded by default; header shows the live step
  const sum=el("summary");
  const spin=el("span","spin");
  const title=el("span",null,"Reasoning");
  const chev=el("span","chev","▾");
  sum.appendChild(spin); sum.appendChild(title); sum.appendChild(chev);
  reason.appendChild(sum);
  const body=el("div","body"); reason.appendChild(body);
  col.appendChild(reason);

  const card=el("div","answer-card"); card.style.display="none";
  const ans=el("div","md");
  const images=el("div","art-imgs");   // image artifacts (plots/maps) rendered inline
  const files=el("div","files");       // non-image artifacts as download chips
  card.appendChild(ans); card.appendChild(images); card.appendChild(files);
  col.appendChild(card);

  row.appendChild(col); turn.appendChild(row); thread.appendChild(turn); scrollDown();
  return {turn,reason,spin,title,body,card,ans,images,files};
}

function pushLine(ui,text,kind){
  if(!text) return;
  const last=ui.body.lastChild;
  if(last && last.textContent===text) return;       // dedupe consecutive
  ui.body.appendChild(el("div","ln"+(kind?(" "+kind):""),null)).textContent=text;
  // A per-document line is detail, not the current step — don't let it take over the header.
  if(kind!=="doc") ui.title.textContent=text.length>70?text.slice(0,70)+"…":text;
  scrollDown();
}

/* A clickable document line (title -> its landing url) inside the reasoning log. */
function pushDocLine(ui,title,url){
  const ln=el("div","ln doc",null);
  if(url && /^https?:\/\//i.test(url)){
    const a=el("a",null,null); a.href=url; a.target="_blank"; a.rel="noopener noreferrer";
    a.textContent=title||url; ln.appendChild(a);
  }else{
    ln.textContent=title||"(untitled)";
  }
  ui.body.appendChild(ln); scrollDown();
}

function addFeedback(col){
  const fb=el("div","feedback");
  const q=el("div","q");
  q.appendChild(el("span",null,"Was this answer helpful?"));
  const up=el("button","iconbtn",ICONS.thumbUp), down=el("button","iconbtn",ICONS.thumbDown);
  up.title="Helpful"; down.title="Not helpful";
  up.onclick=()=>{up.classList.add("on");down.classList.remove("on");};
  down.onclick=()=>{down.classList.add("on");up.classList.remove("on");};

  fb.appendChild(more);
  col.appendChild(fb);
}

/* ===================== downloads collection (per message) ===================== */
function collectDownloads(value, into){
  if(!value) return;
  if(Array.isArray(value)){ value.forEach(v=>collectDownloads(v,into)); return; }
  if(typeof value==="string"){ try{ collectDownloads(JSON.parse(value),into);}catch(_){} return; }
  if(typeof value!=="object") return;
  if(value.download_url && (value.file_id||value.filename)){
    into.set(String(value.file_id||value.download_url),{
      file_id:value.file_id||"", filename:value.filename||"download", download_url:value.download_url,
      kind:value.kind||""
    });
  }
  Object.values(value).forEach(v=>collectDownloads(v,into));
}
function renderFiles(ui,map){
  // URLs/ids already embedded as <img> in the answer prose — don't render them twice.
  const embedded=new Set();
  if(ui.ans && ui.ans.querySelectorAll){ ui.ans.querySelectorAll("img").forEach(im=>embedded.add(im.getAttribute("src")||"")); }
  // already inline if an embedded <img> has the same resolved URL, or references this file_id
  // as a URL path segment (/<file_id>/) — NOT a bare substring (would false-match base64/long URLs).
  const seenInline=(f,url)=> embedded.has(url) || (f.file_id && [...embedded].some(s=>s && s.indexOf("/"+f.file_id+"/")>=0));

  ui.images.innerHTML=""; ui.files.innerHTML="";
  for(const f of map.values()){
    const url=absoluteUrl(f.download_url);
    const isImg = f.kind==="image" || isImageName(f.filename) || isImageName(f.download_url);
    if(isImg){
      if(seenInline(f,url)) continue;                 // already shown inline in the answer
      const fig=el("figure","art");
      const link=el("a"); link.href=url; link.target="_blank"; link.rel="noopener noreferrer";
      const im=new Image(); im.src=url; im.alt=f.filename||"image"; im.loading="lazy";
      link.appendChild(im); fig.appendChild(link);
      const cap=el("figcaption");
      cap.appendChild(el("span","nm")).textContent=f.filename||f.file_id||"image";
      const dl=el("a","dl",ICONS.file); dl.href=url; dl.target="_blank"; dl.rel="noopener noreferrer";
      dl.appendChild(document.createTextNode("Download"));
      cap.appendChild(dl); fig.appendChild(cap);
      ui.images.appendChild(fig);
    }else{
      const a=el("a",null,(f.kind==="source"?ICONS.fileCode:ICONS.file));
      a.href=url; a.target="_blank"; a.rel="noopener noreferrer";
      a.appendChild(document.createTextNode(f.filename||f.file_id));
      ui.files.appendChild(a);
    }
  }
}

/* ===================== search activity in the reasoning log =====================
   Tool payloads reach us through the trace's _short_text(), which collapses whitespace and cuts
   at AGENT_TRACE_TEXT_LIMIT (1200 chars). A retrieval result carrying 8 documents with real
   abstracts is well past that, so JSON.parse FAILS on most search results. Every reader below
   therefore falls back to scraping the fields out of the truncated text — which is also why the
   Sources block under the answer is built from the final evidence instead of from these lines. */
/* Must list EVERY retrieval tool: a name absent here is not merely unlabelled, it is dropped
   from the reasoning log entirely, so the user cannot tell whether the agent consulted the
   method library or ignored it. kb_method_search / get_method_contract were missing, which
   made the whole feature invisible in the one place a user looks to check the agent's work. */
const RETRIEVAL_TOOLS=new Set(["keyword_search","semantic_search","neo4j_search","spatial_search",
  "opengeodata_search","web_search","agent_kb_search","neo4j_get_element_by_id",
  "neo4j_explore_related_nodes","get_kb_block",
  "kb_method_search","get_method_contract","mcp_fetch_element_source"]);

/* A tool_result's `content` is the repr of a LangChain ToolMessage, not bare JSON:
   content='{"source": "keyword", ...}' name='keyword_search' tool_call_id='call_x'
   Unwrap it, or every payload would fail JSON.parse and be reported as truncated. */
function unwrapToolContent(raw){
  let s=String(raw==null?"":raw);
  if(!/^content=['"]/.test(s)) return s;
  const quote=s.charAt(8);              // content=' -> the quote is at index 8
  s=s.slice(9);
  // In a FULL repr the JSON ends at the last `<quote> name=`. A payload cut at the trace's
  // 1200-char limit has no tail at all — anchoring the match on it silently left the whole
  // `content='...` prefix in place, which is why unwrapping appeared not to work.
  const tail=s.lastIndexOf(quote+" name=");
  if(tail!==-1) s=s.slice(0,tail);
  // Undo the repr's own escaping, in ONE left-to-right pass so neither escape mangles the other:
  //   \'  -> '   an apostrophe inside the single-quoted wrapper ("exceeds 'open river' conditions")
  //             is not a legal JSON escape and alone breaks JSON.parse;
  //   \\  -> \   the payload is dumped with ensure_ascii, so a title's em dash is already \u2014
  //             and repr escapes THAT backslash. Left doubled, the title renders as a literal
  //             "\u2014" no matter how the value is decoded afterwards.
  return quote==="'" ? s.replace(/\\(['\\])/g,"$1") : s;
}

/* tool_call args arrive as a PYTHON dict repr string — {'query': 'dams in Illinois', 'limit': 8} */
function parseToolArgs(raw){
  if(raw==null) return null;
  if(typeof raw==="object") return raw;
  const s=String(raw).trim();
  try{ return JSON.parse(s); }catch(_){}
  if(/^\{[\s\S]*\}$/.test(s)){
    try{ return JSON.parse(s.replace(/'/g,'"')); }catch(_){}   // fails on an apostrophe; falls through
  }
  return s;
}

/* Values scraped by regex come from INSIDE a JSON string literal, so they still carry its escapes
   (—, \n, \"). Re-parsing them as a JSON string decodes those; without it a title renders as
   "Home — SIGSPATIAL Conference". */
function decodeJsonEscapes(s){
  try{ return JSON.parse('"'+String(s)+'"'); }catch(_){ return String(s); }
}

function looseJson(text){
  const s=String(text||"");
  try{ return JSON.parse(s); }catch(_){}
  // Truncated payload: pull out what we can without a parser.
  const num=(k)=>{ const m=s.match(new RegExp('"'+k+'"\\s*:\\s*(-?\\d+)')); return m?Number(m[1]):null; };
  const str=(k)=>{ const m=s.match(new RegExp('"'+k+'"\\s*:\\s*"((?:[^"\\\\]|\\\\.)*)"')); return m?decodeJsonEscapes(m[1]):null; };
  // `symbol` as well as `title`: a kb_method_search row has no title, so a truncated method
  // search salvaged zero rows and rendered as "no results".
  const titles=[]; const re=/"(?:title|symbol)"\s*:\s*"((?:[^"\\]|\\.)*)"/g; let m;
  while((m=re.exec(s))&&titles.length<40) titles.push(decodeJsonEscapes(m[1]));
  const urls=[]; const ru=/"url"\s*:\s*"(https?:(?:[^"\\]|\\.)*)"/g;
  while((m=ru.exec(s))&&urls.length<40) urls.push(decodeJsonEscapes(m[1]));
  return {__partial:true, count:num("count"), chars:num("chars"), status:num("status"),
    candidates_found:num("candidates_found"), filtered_out:num("filtered_out"),
    paragraphs_kept:num("paragraphs_kept"), paragraphs_total:num("paragraphs_total"),
    source:str("source"), provider:str("provider"), error:str("error"), title:str("title"),
    url:str("url"), search_query:str("search_query"), __titles:titles, __urls:urls};
}

/* The interesting argument of a search/fetch call, for the "→ tool(...)" line. */
function toolArgSummary(name,args){
  if(args==null) return "";
  if(typeof args==="string") return args.length>90?args.slice(0,90)+"…":args;
  if(typeof args!=="object") return String(args);
  const pick=["query","url","element_id","doc_id","focus","recency_days","limit","depth"];
  const parts=[];
  for(const k of pick){
    if(args[k]===undefined||args[k]===null||args[k]==="") continue;
    let v=String(args[k]);
    if(v.length>80) v=v.slice(0,80)+"…";
    parts.push(k==="query"||k==="url"?'"'+v+'"':k+"="+v);
  }
  return parts.join(", ");
}

/* Documents/results carried by a tool payload, normalized to {title,url}. */
function payloadItems(obj){
  const rows=[];
  // `symbol` is here because a kb_method_search row has no title/name/doc_id/url at all, so
  // every one was skipped and the line rendered as "no results" for real hits.
  const push=(d)=>{ if(!d) return; const t=d.title||d.name||d.doc_id||d.id||d.symbol;
                    if(t||d.url) rows.push({title:t,url:d.url}); };
  if(Array.isArray(obj.documents)) obj.documents.forEach(push);
  if(Array.isArray(obj.results)) obj.results.forEach(push);
  if(!rows.length && Array.isArray(obj.__titles)){
    obj.__titles.forEach((t,i)=>rows.push({title:t,url:(obj.__urls||[])[i]}));
  }
  return rows;
}

/* Render one tool_result as a summary line (+ up to 3 document lines). Returns a tally delta. */
function reportToolResult(ui,name,content){
  const obj=looseJson(content);
  const tally={searches:0,hits:0,fetches:0};
  const partial=obj.__partial?" (log truncated)":"";

  if(obj.error){
    const blocked=obj.blocked?"refused":"error";
    pushLine(ui,name+" "+blocked+": "+obj.error,"warn");
    return tally;
  }

  if(name==="web_fetch"){
    tally.fetches=1;
    const host=(()=>{ try{ return new URL(obj.url).hostname; }catch(_){ return obj.url||"page"; } })();
    const kept=(obj.paragraphs_kept!=null&&obj.paragraphs_total!=null)
      ? (" · kept "+obj.paragraphs_kept+"/"+obj.paragraphs_total+" paragraphs") : "";
    const size=(obj.chars!=null)?(" — "+obj.chars+" chars"):"";   // absent when the log cut it off
    pushLine(ui,"read "+host+size+kept+(obj.cached?" · from cache":""),"hit");
    if(obj.title) pushDocLine(ui,obj.title,obj.url);
    return tally;
  }

  if(RETRIEVAL_TOOLS.has(name)){
    tally.searches=1;
    const items=payloadItems(obj);
    const n=(obj.count!=null?obj.count:items.length);
    tally.hits=n||0;
    if(!n){
      pushLine(ui,name+" → no results"+partial,"miss");
      return tally;
    }
    const extra=[];
    if(obj.provider) extra.push(obj.provider);
    if(obj.candidates_found!=null&&obj.filtered_out) extra.push(obj.candidates_found+" found, "+obj.filtered_out+" filtered out");
    if(obj.search_query) extra.push('searched "'+obj.search_query+'"');
    pushLine(ui,name+" → "+n+" result"+(n===1?"":"s")+(extra.length?" ("+extra.join("; ")+")":"")+partial,"hit");
    items.slice(0,3).forEach(it=>pushDocLine(ui,it.title,it.url));
    if(items.length>3) pushLine(ui,"+"+(items.length-3)+" more","doc");
    return tally;
  }
  return tally;
}

/* Live count beside the "Reasoning" header, so the folded accordion still says what happened. */
function updateTally(ui,state){
  const t=state.tally, bits=[];
  if(t.searches) bits.push(t.searches+" search"+(t.searches===1?"":"es"));
  if(t.hits) bits.push(t.hits+" result"+(t.hits===1?"":"s"));
  if(t.fetches) bits.push(t.fetches+" page"+(t.fetches===1?"":"s")+" read");
  if(!bits.length) return;
  if(!ui.tally){ ui.tally=el("span","tally",null); ui.title.parentNode.insertBefore(ui.tally,ui.title.nextSibling); }
  ui.tally.textContent="· "+bits.join(" · ");
}

/* ===================== sources under the answer =====================
   Built from the run's EVIDENCE (what actually grounded the answer), not from the reasoning log,
   whose payloads are truncated. Internal KB hits carry no url client-side — the platform link is
   composed server-side from FRONTEND_DOMAIN — so those are listed without a link rather than with
   a guessed one. */
function evidenceDocs(response){
  const out=[];
  const seen=new Set();
  const add=(d)=>{
    if(!d||typeof d!=="object") return;
    const src=(d.document&&typeof d.document==="object")?d.document:d;
    const id=String(src.doc_id||src.id||src.url||src.title||"");
    if(!id||seen.has(id)) return;
    seen.add(id); out.push(src);
  };
  const ar=response&&response.agent_result;
  const orch=ar&&ar.orchestration_result;
  if(orch&&Array.isArray(orch.evidence)) orch.evidence.forEach(add);
  // opengeodata_results is a server-side projection that (deliberately) covers only the catalogs;
  // union it in so nothing is lost if the evidence shape changes.
  if(Array.isArray(response&&response.opengeodata_results)) response.opengeodata_results.forEach(add);
  return out;
}

function sourceGroup(src){
  const et=String(src.element_type||src["resource-type"]||"").toLowerCase();
  const sn=String(src.source||src.source_system||"").toLowerCase();
  if(et==="web"||sn==="web") return "web";
  if(et==="opengeodata"||sn==="opengeodata") return "external";
  return "internal";
}

function renderSources(ui,response){
  const docs=evidenceDocs(response);
  if(!docs.length) return;
  const groups={internal:[],external:[],web:[]};
  docs.forEach(d=>groups[sourceGroup(d)].push(d));

  const box=el("div","srcs");
  box.appendChild(el("h4",null,"Sources used"));
  const LABEL={internal:"I-GUIDE knowledge base",external:"External open-data catalogs",web:"Open web"};
  const ORDER=["internal","external","web"];
  let any=false;

  for(const key of ORDER){
    const rows=groups[key];
    if(!rows.length) continue;
    any=true;
    const grp=el("div","grp");
    const hd=el("div","hd",null);
    hd.appendChild(document.createTextNode(LABEL[key]));
    hd.appendChild(el("span","n",null)).textContent=rows.length+" item"+(rows.length===1?"":"s");
    grp.appendChild(hd);

    for(const src of rows.slice(0,12)){
      const it=el("div","it");
      const t=el("div","t",null);
      const title=String(src.title||src.doc_id||"(untitled)");
      const url=String(src.url||"");
      if(/^https?:\/\//i.test(url)){
        const a=el("a",null,null); a.href=url; a.target="_blank"; a.rel="noopener noreferrer";
        a.textContent=title; t.appendChild(a);
      }else{
        t.textContent=title;
      }
      it.appendChild(t);

      const snip=String(src.abstract||src.snippet||src.contents||"").trim();
      if(snip){
        const sn=el("div","sn",null);
        sn.textContent=snip.length>260?snip.slice(0,260)+"…":snip;
        it.appendChild(sn);
      }

      const meta=el("div","meta",null);
      const badge=(txt,cls)=>{ if(!txt) return; meta.appendChild(el("span","b"+(cls?" "+cls:""),null)).textContent=txt; };
      if(key==="web"){
        let host=""; try{ host=new URL(url).hostname; }catch(_){}
        badge(host||"web","web");
      }else if(key==="external"){
        badge(String(src.provider||src.source_system||"catalog"),"ext");
        if(src.license) badge(String(src.license));
      }else{
        badge(String(src.element_type||"element"));
      }
      if(Array.isArray(src.bbox)&&src.bbox.length===4) badge("georeferenced");
      if(meta.childNodes.length) it.appendChild(meta);
      grp.appendChild(it);
    }
    if(rows.length>12) grp.appendChild(el("div","sn",null)).textContent="+"+(rows.length-12)+" more not shown";
    box.appendChild(grp);
  }
  if(any) ui.card.insertBefore(box,ui.images);
}

/* ===================== event -> reasoning line ===================== */
function reasoningLine(eventName,p){
  if(eventName==="node") return p.message || (p.stage?("Node: "+p.stage):null);
  if(eventName==="routing"){ const d=p.detail||{}; return d.route?("Route: "+d.route):null; }
  if(eventName==="status"){
    const s=p.status||p.stage; if(!s) return null;
    const map={started:"Starting",initialized:"Initialized",orchestration_agent_started:"Orchestrating",
      orchestration_agent_completed:"Orchestration complete",persistent_memory_disabled:null,agent_chat_started:null};
    return (s in map)?map[s]:String(s).replace(/_/g," ");
  }
  if(eventName==="grounding_audit") return "Grounding check: "+(p.message||p.severity||"done");
  if(eventName==="search"||eventName==="analysis"){
    // The category copy of a tool_call/tool_result carries no message of its own — agent_trace is
    // where that detail lives, so reporting this too would duplicate every line.
    if(p.type==="tool_call"||p.type==="tool_result"||p.type==="tool_error") return null;
  }
  if(eventName==="search") return p.message || "Searching the knowledge base";
  if(eventName==="tool_error") return null;   // handled with its own styling in handleBlock
  // Detail-tier events, available only when the "Detailed reasoning log" toggle is on. llm_start /
  // llm_end are deliberately ignored: one pair per peer call, carrying nothing a reader can use.
  if(eventName==="llm_message"){
    const t=String(p.message||"").trim();
    return t ? ("thinking: "+(t.length>200?t.slice(0,200)+"…":t)) : null;
  }
  if(eventName==="decision"||eventName==="route_decision"||eventName==="supervisor_decision"){
    const d=p.detail||p;
    const route=d.route||d.next_action||p.route;
    const why=d.reason||d.why||d.message;
    if(route) return "decision: "+route+(why&&why!==route?(" — "+String(why).slice(0,90)):"");
    return why?("decision: "+String(why).slice(0,110)):null;
  }
  if(eventName==="search_complete"){
    const n=(p.detail&&p.detail.document_count)??p.document_count;
    return n!=null?("search complete — "+n+" documents in evidence"):null;
  }
  if(eventName==="analysis") return p.message || null;
  if(eventName==="file") return null;
  if(eventName==="error") return "Error: "+(p.message||p.error||"failed");
  return null;
}

/* ===================== streaming ===================== */
function buildPayload(text, fileIds){
  // Only send real (resolved) file ids — drop any optimistic "tmp:" placeholders
  // for uploads that haven't finished yet.
  const ids = (fileIds||[]).filter(id => id && !String(id).startsWith("tmp:"));
  return {
    user_input:text,
    memory_id: memoryId, thread_id: threadId,
    conversation_name: document.getElementById("conversation_name").value.trim()||"I-GUIDE chat",
    recent_k: CONFIG.recent_k,
    tool_strategy: CONFIG.tool_strategy,
    include_mcp_tools: CONFIG.include_mcp_tools,
    mcp_modules: CONFIG.mcp_modules,
    enabled_search_methods: CONFIG.enabled_search_methods,
    use_persistent_memory: CONFIG.use_persistent_memory,
    smart_tool_routing: CONFIG.smart_tool_routing,
    file_ids: ids,
    verbose: false,
    agent_dev: (document.getElementById("agent_dev") || {}).checked ?? CONFIG.agent_dev,
    use_supervisor: CONFIG.use_supervisor,
    code_exec: CONFIG.code_exec,
  };
}

function handleBlock(block, ui, downloads, state){
  if(!block.trim()) return;
  let eventName="message"; const data=[];
  for(const line of block.split("\n")){
    if(line.startsWith("event:")) eventName=line.slice(6).trim();
    else if(line.startsWith("data:")) data.push(line.slice(5).trim());
  }
  let p={}; const raw=data.join("\n");
  if(raw){ try{ p=JSON.parse(raw); }catch(_){ p={raw}; } }

  // WIRE FORMAT: the HTTP endpoint does not emit `tool_call`/`tool_result` as event NAMES. It wraps
  // them as `event: agent_trace` with the real type in data.type and the payload in data.detail —
  // and separately re-emits the same thing under a category name ("search"/"analysis"). Unwrap
  // agent_trace and treat it as the canonical copy; the category copy is suppressed below so a
  // single tool call is not reported twice.
  if(eventName==="agent_trace" && p && p.type){
    const det=(p.detail && typeof p.detail==="object")?p.detail:{};
    eventName=p.type;
    p=Object.assign({}, det, {agent:p.agent, node:p.node});
  }

  collectDownloads(p, downloads);

  // capture thread/memory ids from any detail/payload
  const det=p.detail||p;
  if(det){ if(det.thread_id) state.thread=det.thread_id; if(det.memory_id) state.memory=det.memory_id;
           if(p.threadId) state.thread=p.threadId; if(p.memoryId) state.memory=p.memoryId; }

  // answer (completed | result)
  if(eventName==="answer"){
    const t=p.final_answer || p.answer || (p.detail&&(p.detail.final_answer||p.detail.answer));
    if(t){ state.answer=t; }
  }
  if(eventName==="error"){ state.error=p.error||p.message||"Request failed"; }
  // The terminal "response" event carries the whole run, including the evidence the answer was
  // grounded in — that is what the Sources block is built from.
  if(eventName==="response"||eventName==="result"){ state.response=p; }

  // --- search activity -----------------------------------------------------------
  // These events were previously dropped on the floor (reasoningLine returned null), so the log
  // said only "Searching" and "N docs in evidence" — never WHICH method ran, with what query, or
  // what came back.
  if(eventName==="tool_call"){
    const name=p.name||(p.tool_calls&&p.tool_calls[0]&&p.tool_calls[0].name)||"tool";
    const args=parseToolArgs(p.args!==undefined?p.args:(p.tool_calls&&p.tool_calls[0]&&p.tool_calls[0].args));
    if(RETRIEVAL_TOOLS.has(name)||name==="web_fetch"){
      const a=toolArgSummary(name,args);
      pushLine(ui,name+"("+a+")","tool");
      state.tools.push(name);
    }
  }
  if(eventName==="tool_result"){
    const name=p.tool_name||p.name||"tool";
    if(RETRIEVAL_TOOLS.has(name)||name==="web_fetch"){
      const d=reportToolResult(ui,name,unwrapToolContent(p.content!==undefined?p.content:p.message));
      state.tally.searches+=d.searches; state.tally.hits+=d.hits; state.tally.fetches+=d.fetches;
      updateTally(ui,state);
    }
  }
  if(eventName==="tool_error"){
    const name=p.tool_name||p.name||"tool";
    pushLine(ui,name+" failed: "+(p.message||"unknown error"),"warn");
  }

  const ln=reasoningLine(eventName,p);
  if(ln){
    // A refined-query retry is a distinct event in the search loop; make it read like one.
    let kind=null;
    if(/^Retrying with a refined query/i.test(ln)) kind="retry";
    else if(ln.startsWith("thinking: ")) kind="think";
    else if(ln.startsWith("decision: ")) kind="route";
    pushLine(ui,ln,kind);
  }
  if(Object.keys(downloads).length) renderFiles(ui,downloads);
}

async function streamTurn(text, ui, fileIds){
  aborter=new AbortController();
  const downloads=new Map();
  const state={answer:"",error:"",thread:null,memory:null,response:null,tools:[],tally:{searches:0,hits:0,fetches:0}};
  const url=reqUrl("endpoint","/agent/chat/stream");
  pushLine(ui,"Sending request");
  const resp=await fetch(url,{method:"POST",headers:authHeaders(true),body:JSON.stringify(buildPayload(text, fileIds)),signal:aborter.signal});
  if(!resp.ok||!resp.body){ throw new Error(await describeHttpError(resp)); }
  const reader=resp.body.getReader(), dec=new TextDecoder(); let buf="";
  while(true){
    const {done,value}=await reader.read(); if(done) break;
    buf+=dec.decode(value,{stream:true});
    let b=buf.indexOf("\n\n");
    while(b!==-1){ handleBlock(buf.slice(0,b),ui,downloads,state); buf=buf.slice(b+2); b=buf.indexOf("\n\n"); }
  }
  if(buf.trim()) handleBlock(buf,ui,downloads,state);
  return {downloads,state};
}

/* ===================== submit ===================== */
const input=document.getElementById("input");
const sendBtn=document.getElementById("send-btn");
const sendIcon=document.getElementById("send-icon");
const sendSpin=document.getElementById("send-spin");

function setBusy(on){
  busy=on;
  sendBtn.disabled=on; sendIcon.classList.toggle("hidden",on); sendSpin.classList.toggle("hidden",!on);
  input.placeholder = on ? "We are processing your inquery…" : "Ask me anything…";
}

async function submit(){
  const text=input.value.trim();
  if(!text||busy) return;
  const files=Array.from(pendingFiles.values());
  const fileIds=Array.from(pendingFiles.keys());   // capture BEFORE clearing (payload needs these)
  addUserTurn(text, files);
  input.value=""; autoSize();
  // attachments are consumed by this turn
  pendingFiles.clear(); renderAttbar();
  setBusy(true);
  const ui=addAiTurn();
  try{
    const {downloads,state}=await streamTurn(text, ui, fileIds);
    if(state.thread){ threadId=state.thread; } if(state.memory){ memoryId=state.memory; }
    ui.spin.classList.add("hidden");
    if(state.error){
      ui.reason.open=false;
      ui.card.style.display=""; ui.ans.innerHTML=""; ui.ans.appendChild(el("div","err",null)).textContent=state.error;
    }else{
      ui.title.textContent="Reasoning"; ui.reason.open=false;
      ui.card.style.display="";
      ui.ans.innerHTML=renderMarkdown(state.answer || "_No answer returned._");
      renderSources(ui,state.response);
      renderFiles(ui,downloads);
      addFeedback(ui.card.parentElement);
    }
  }catch(err){
    ui.spin.classList.add("hidden"); ui.reason.open=false;
    ui.card.style.display=""; ui.ans.innerHTML="";
    ui.ans.appendChild(el("div","err",null)).textContent=String(err.message||err);
  }finally{
    setBusy(false); aborter=null; scrollDown();
  }
}

/* ===================== attachments ===================== */
const attbar=document.getElementById("attbar");
function renderAttbar(){
  attbar.innerHTML="";
  for(const f of pendingFiles.values()){
    const chip=el("span","chip",ICONS.paperclip);
    chip.appendChild(document.createTextNode(f.filename||f.file_id));
    const x=el("button",null,ICONS.x); x.title="Remove"; x.onclick=()=>{pendingFiles.delete(String(f.file_id));renderAttbar();};
    chip.appendChild(x); attbar.appendChild(chip);
  }
}
async function uploadFiles(fileList){
  const files=Array.from(fileList||[]); if(!files.length) return;
  const fd=new FormData(); files.forEach(f=>fd.append("files",f));
  // optimistic chips
  const tmp=files.map(f=>({file_id:"…",filename:f.name,pending:true}));
  tmp.forEach(t=>pendingFiles.set("tmp:"+t.filename,t)); renderAttbar();
  try{
    const url=reqUrl("upload_endpoint","/agent/files/upload");
    const r=await fetch(url,{method:"POST",headers:authHeaders(false),body:fd});
    // /agent/files/upload is now API-key protected too, so check status BEFORE parsing:
    // an auth failure body is JSON but the useful message is the actionable one.
    if(!r.ok) throw new Error(await describeHttpError(r));
    const p=await r.json();
    tmp.forEach(t=>pendingFiles.delete("tmp:"+t.filename));
    for(const f of (p.files||[])) pendingFiles.set(String(f.file_id),{file_id:f.file_id,filename:f.filename});
    renderAttbar();
  }catch(e){
    tmp.forEach(t=>pendingFiles.delete("tmp:"+t.filename)); renderAttbar();
    alert("Upload failed: "+(e.message||e));
  }
}
document.getElementById("attach-btn").onclick=()=>document.getElementById("file-input").click();
document.getElementById("file-input").onchange=(e)=>{ uploadFiles(e.target.files); e.target.value=""; };

/* ===================== composer behavior ===================== */
function autoSize(){ input.style.height="auto"; input.style.height=Math.min(input.scrollHeight,180)+"px"; }
input.addEventListener("input",autoSize);
input.addEventListener("keydown",(e)=>{ if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){ e.preventDefault(); submit(); }});
document.getElementById("composer").addEventListener("submit",(e)=>{ e.preventDefault(); submit(); });
autoSize();
</script>
