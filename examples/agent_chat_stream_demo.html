<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent Chat Stream Demo</title>
  <style>
    :root {
      --bg: #f5f1e8;
      --panel: #fffdf8;
      --ink: #18222f;
      --muted: #687384;
      --line: #d7cfbf;
      --accent: #0c7c59;
      --accent-2: #d95d39;
      --code: #efe7d7;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      background:
        radial-gradient(circle at top right, rgba(217, 93, 57, 0.12), transparent 25%),
        radial-gradient(circle at bottom left, rgba(12, 124, 89, 0.10), transparent 25%),
        var(--bg);
      color: var(--ink);
    }

    .page {
      width: min(1200px, calc(100vw - 32px));
      margin: 24px auto;
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 18px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 12px 40px rgba(24, 34, 47, 0.08);
      overflow: hidden;
    }

    .panel-header {
      padding: 16px 18px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(255,255,255,0.9), rgba(239,231,215,0.6));
    }

    .panel-header h1,
    .panel-header h2 {
      margin: 0;
      font-size: 1.1rem;
      letter-spacing: 0.02em;
    }

    .panel-body {
      padding: 16px 18px 18px;
    }

    .controls {
      display: grid;
      gap: 12px;
    }

    label {
      display: grid;
      gap: 6px;
      font-size: 0.92rem;
      color: var(--ink);
    }

    .inline {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    input,
    textarea,
    select,
    button {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
      font: inherit;
      color: var(--ink);
      background: #fff;
    }

    textarea {
      resize: vertical;
      min-height: 88px;
    }

    .checkboxes {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .checkbox-group {
      display: grid;
      gap: 8px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #fff;
    }

    .checkbox-group-title {
      font-size: 0.88rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
    }

    .checkbox {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      font-size: 0.92rem;
    }

    .checkbox input {
      width: auto;
      margin: 0;
    }

    .actions {
      display: flex;
      gap: 10px;
    }

    button {
      cursor: pointer;
      font-weight: 600;
    }

    .primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .secondary {
      background: transparent;
      color: var(--accent-2);
      border-color: var(--accent-2);
    }

    .output {
      display: grid;
      gap: 16px;
    }

    .statusbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      font-size: 0.88rem;
      color: var(--muted);
    }

    .chip {
      padding: 7px 10px;
      border-radius: 999px;
      background: var(--code);
      border: 1px solid var(--line);
    }

    .answer {
      white-space: pre-wrap;
      overflow-wrap: break-word;
      word-break: break-word;
      line-height: 1.55;
      min-height: 120px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fff;
    }

    .doc-list,
    .event-list {
      margin: 0;
      padding-left: 18px;
    }

    .event-log {
      max-height: 480px;
      overflow-x: hidden;
      overflow-y: auto;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fff;
      padding: 12px 14px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.84rem;
      line-height: 1.45;
    }

    .event-log pre {
      white-space: pre-wrap;
      overflow-wrap: break-word;
      word-break: break-all;
    }

    .event-item {
      margin-bottom: 10px;
      padding-bottom: 10px;
      border-bottom: 1px dashed var(--line);
    }

    .event-item:last-child {
      border-bottom: none;
      margin-bottom: 0;
      padding-bottom: 0;
    }

    .event-name {
      font-weight: 700;
      color: var(--accent);
    }

    .event-name.node {
      color: #b8860b;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      font-size: 0.78rem;
    }

    .trace-message {
      margin-top: 6px;
      white-space: pre-wrap;
      overflow-wrap: break-word;
      word-break: break-word;
    }

    .trace-meta {
      margin-top: 4px;
      color: var(--muted);
      font-size: 0.78rem;
    }

    .muted {
      color: var(--muted);
    }

    .error {
      color: #9f2f1f;
    }

    @media (max-width: 980px) {
      .page {
        grid-template-columns: 1fr;
      }
    }

    /* Markdown rendering for the final answer */
    .answer.markdown-body { white-space: normal; }
    .markdown-body > *:first-child { margin-top: 0; }
    .markdown-body > *:last-child { margin-bottom: 0; }
    .markdown-body h1, .markdown-body h2, .markdown-body h3,
    .markdown-body h4 { line-height: 1.25; margin: 0.9em 0 0.4em; font-weight: 700; }
    .markdown-body h1 { font-size: 1.5rem; border-bottom: 1px solid var(--line); padding-bottom: .2em; }
    .markdown-body h2 { font-size: 1.28rem; border-bottom: 1px solid var(--line); padding-bottom: .2em; }
    .markdown-body h3 { font-size: 1.12rem; }
    .markdown-body p { margin: 0.6em 0; }
    .markdown-body ul, .markdown-body ol { margin: 0.5em 0; padding-left: 1.5em; }
    .markdown-body li { margin: 0.2em 0; }
    .markdown-body code { background: #f1f5f9; border: 1px solid var(--line); border-radius: 6px;
      padding: 0.1em 0.35em; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.9em; }
    .markdown-body pre { background: #0f172a; color: #e2e8f0; border-radius: 10px; padding: 12px 14px;
      overflow: auto; margin: 0.7em 0; }
    .markdown-body pre code { background: none; border: none; color: inherit; padding: 0; font-size: 0.85rem; }
    .markdown-body blockquote { margin: 0.6em 0; padding: 0.2em 0.9em; border-left: 4px solid var(--accent);
      background: #f8fafc; color: var(--muted); }
    .markdown-body a { color: var(--accent); text-decoration: underline; }
    .markdown-body hr { border: none; border-top: 1px solid var(--line); margin: 1em 0; }
    .markdown-body table { border-collapse: collapse; margin: 0.7em 0; }
    .markdown-body th, .markdown-body td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; }
    .markdown-body th { background: #f1f5f9; font-weight: 700; }
    .markdown-body strong { font-weight: 700; }
  </style>
</head>
<body>
  <div class="page">
    <section class="panel">
      <div class="panel-header">
        <h1>Agent Chat Stream Demo</h1>
      </div>
      <div class="panel-body">
        <form id="chat-form" class="controls">
          <label>
            Endpoint
            <input id="endpoint" value="/agent/chat/stream">
          </label>

          <label>
            Upload Endpoint
            <input id="upload_endpoint" value="/agent/files/upload">
          </label>

          <label>
            API Key
            <input id="api_key" type="password" placeholder="AGENT_CHAT_API_KEY">
          </label>

          <label>
            User Input
            <textarea id="user_input">Inspect the attached CSV and tell me the main columns. Save a short summary to ./outputs/crime_summary.txt</textarea>
          </label>

          <div class="inline">
            <label>
              Memory ID
              <input id="memory_id" value="demo-session-1">
            </label>
            <label>
              Thread ID
              <input id="thread_id" value="demo-thread-1">
            </label>
          </div>

          <div class="inline">
            <label>
              Conversation Name
              <input id="conversation_name" value="Agent chat demo">
            </label>
            <label>
              Recent K
              <input id="recent_k" type="number" min="0" value="8">
            </label>
          </div>

          <div class="inline">
            <label>
              Tool Strategy
              <select id="tool_strategy">
                <option value="granular" selected>granular</option>
                <option value="full_pipeline">full_pipeline</option>
              </select>
            </label>
            <label>
              Forced Intent
              <select id="forced_intent">
                <option value="">auto</option>
                <option value="general_discovery">general_discovery</option>
                <option value="analysis_task">analysis_task</option>
                <option value="code_task">code_task</option>
                <option value="hybrid">hybrid</option>
              </select>
            </label>
          </div>

          <label>
            MCP Modules
            <input id="mcp_modules" value="search_tools,data_tools,spatial_analysis_tools">
          </label>

          <div class="checkbox-group">
            <div class="checkbox-group-title">I-GUIDE Searches</div>
            <label class="checkbox">
              <input class="search-method" type="checkbox" value="keyword_search" checked>
              Keyword Search
            </label>
            <label class="checkbox">
              <input class="search-method" type="checkbox" value="semantic_search" checked>
              Semantic Search
            </label>
            <label class="checkbox">
              <input class="search-method" type="checkbox" value="neo4j_search" checked>
              Neo4j Search
            </label>
            <label class="checkbox">
              <input class="search-method" type="checkbox" value="neo4j_get_element_by_id" checked>
              Neo4j Get By ID
            </label>
            <label class="checkbox">
              <input class="search-method" type="checkbox" value="neo4j_explore_related_nodes" checked>
              Neo4j Traverse ID
            </label>
            <label class="checkbox">
              <input class="search-method" type="checkbox" value="spatial_search" checked>
              Spatial Search
            </label>
            <label class="checkbox">
              <input class="search-method" type="checkbox" value="agent_kb_search" checked>
              Agent KB (inside elements)
            </label>
            <label class="checkbox">
              <input class="search-method" type="checkbox" value="kb_method_search" checked>
              Method Library (callable units)
            </label>
            <label class="checkbox">
              <input class="search-method" type="checkbox" value="opengeodata_search" checked>
              OpenGeoData Search
            </label>
            <label class="checkbox">
              <input class="search-method" type="checkbox" value="web_search">
              Open Web (search + fetch)
            </label>
          </div>

          <label>
            Upload Files
            <input id="upload_files" type="file" multiple>
          </label>

          <div class="actions">
            <button class="secondary" type="button" id="upload-btn">Upload Selected Files</button>
            <button class="secondary" type="button" id="clear-files-btn">Clear Attachments</button>
          </div>

          <div>
            <strong>Attached Files</strong>
            <ul class="doc-list" id="attached-files"></ul>
          </div>

          <div class="checkboxes">
            <label class="checkbox">
              <input id="include_mcp_tools" type="checkbox">
              Include MCP Tools
            </label>
            <label class="checkbox">
              <input id="use_persistent_memory" type="checkbox" checked>
              Use Persistent Memory
            </label>
            <label class="checkbox">
              <input id="smart_tool_routing" type="checkbox" checked>
              Smart Tool Routing
            </label>
            <label class="checkbox">
              <input id="verbose" type="checkbox">
              Verbose
            </label>
            <label class="checkbox">
              <input id="agent_dev" type="checkbox">
              Agent Dev (detailed trace)
            </label>
            <label class="checkbox">
              <input id="use_supervisor" type="checkbox" checked>
              Supervisor (peer agents)
            </label>
            <label class="checkbox">
              <input id="code_exec" type="checkbox">
              Code execution (sandbox)
            </label>
          </div>

          <div class="actions">
            <button class="primary" type="submit">Start Stream</button>
            <button class="secondary" type="button" id="stop-btn">Stop</button>
          </div>
        </form>
      </div>
    </section>

    <section class="panel">
      <div class="panel-header">
        <h2>Response</h2>
      </div>
      <div class="panel-body output">
        <div class="statusbar">
          <span class="chip" id="status-chip">idle</span>
          <span class="chip" id="node-chip">node: n/a</span>
          <span class="chip" id="memory-chip">memory: n/a</span>
          <span class="chip" id="thread-chip">thread: n/a</span>
        </div>

        <div>
          <strong>Final Answer</strong>
          <div class="answer" id="answer">No answer yet.</div>
        </div>

        <div>
          <strong>Document Reference IDs</strong>
          <ul class="doc-list" id="doc-refs"></ul>
        </div>

        <div>
          <strong>Downloadable Files</strong>
          <ul class="doc-list" id="download-files"></ul>
        </div>

        <div>
          <strong>Tool Trace</strong>
          <div class="event-log" id="tool-trace"></div>
        </div>
      </div>
    </section>
  </div>

  <script>
    // --- Minimal, dependency-free, XSS-safe Markdown renderer (escape first, then format) ---
    function renderMarkdown(src) {
      const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      const inline = (s) => s
        .replace(/`([^`]+)`/g, (_, c) => `<code>${c}</code>`)
        .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
        .replace(/__([^_]+)__/g, "<strong>$1</strong>")
        .replace(/(^|[^*])\*(?!\s)([^*]+?)\*/g, "$1<em>$2</em>")
        .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (_, t, u) => {
          // Resolve API-relative / sandbox: links against the configured server so
          // downloads work when pointed at a remote deployment (not the page origin).
          const href = String(u).replace(/^sandbox:/i, "");
          let safe;
          if (/^(https?:|mailto:)/i.test(href)) safe = href;
          else if (href.charAt(0) === "/") safe = absoluteUrl(href);
          else safe = "#";
          safe = safe.replace(/"/g, "%22");
          return `<a href="${safe}" target="_blank" rel="noopener noreferrer">${t}</a>`;
        });
      const lines = String(src || "").replace(/\r\n?/g, "\n").split("\n");
      let html = "", i = 0, inUl = false, inOl = false, para = [];
      const closeLists = () => { if (inUl) { html += "</ul>"; inUl = false; } if (inOl) { html += "</ol>"; inOl = false; } };
      const flushPara = () => { if (para.length) { html += "<p>" + inline(esc(para.join("\n"))).replace(/\n/g, "<br>") + "</p>"; para = []; } };
      const isSep = (l) => /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)+\|?\s*$/.test(l);
      const cells = (l) => l.replace(/^\s*\|/, "").replace(/\|\s*$/, "").split("|").map((c) => c.trim());
      while (i < lines.length) {
        const line = lines[i];
        const fence = line.match(/^```(\w*)\s*$/);
        if (fence) { flushPara(); closeLists(); i++; const code = [];
          while (i < lines.length && !/^```\s*$/.test(lines[i])) { code.push(lines[i]); i++; }
          i++; html += `<pre><code>${esc(code.join("\n"))}</code></pre>`; continue; }
        const h = line.match(/^(#{1,6})\s+(.*)$/);
        if (h) { flushPara(); closeLists(); const lvl = h[1].length; html += `<h${lvl}>${inline(esc(h[2]))}</h${lvl}>`; i++; continue; }
        if (/^\s*([-*_])\1{2,}\s*$/.test(line)) { flushPara(); closeLists(); html += "<hr>"; i++; continue; }
        // GFM table: header row + separator row
        if (line.includes("|") && i + 1 < lines.length && isSep(lines[i + 1])) {
          flushPara(); closeLists();
          const head = cells(line); i += 2; const rows = [];
          while (i < lines.length && lines[i].includes("|") && lines[i].trim() !== "") { rows.push(cells(lines[i])); i++; }
          html += "<table><thead><tr>" + head.map((c) => `<th>${inline(esc(c))}</th>`).join("") + "</tr></thead><tbody>"
            + rows.map((r) => "<tr>" + r.map((c) => `<td>${inline(esc(c))}</td>`).join("") + "</tr>").join("") + "</tbody></table>";
          continue;
        }
        const bq = line.match(/^>\s?(.*)$/);
        if (bq) { flushPara(); closeLists(); const q = [];
          while (i < lines.length) { const m = lines[i].match(/^>\s?(.*)$/); if (!m) break; q.push(m[1]); i++; }
          html += `<blockquote>${inline(esc(q.join("\n"))).replace(/\n/g, "<br>")}</blockquote>`; continue; }
        const ul = line.match(/^\s*[-*+]\s+(.*)$/);
        if (ul) { flushPara(); if (inOl) { html += "</ol>"; inOl = false; } if (!inUl) { html += "<ul>"; inUl = true; }
          html += `<li>${inline(esc(ul[1]))}</li>`; i++; continue; }
        const ol = line.match(/^\s*\d+\.\s+(.*)$/);
        if (ol) { flushPara(); if (inUl) { html += "</ul>"; inUl = false; } if (!inOl) { html += "<ol>"; inOl = true; }
          html += `<li>${inline(esc(ol[1]))}</li>`; i++; continue; }
        if (/^\s*$/.test(line)) { flushPara(); closeLists(); i++; continue; }
        para.push(line); i++;
      }
      flushPara(); closeLists();
      return html;
    }
    function setAnswerMarkdown(md) { answerEl.classList.add("markdown-body"); answerEl.innerHTML = renderMarkdown(md); }
    function setAnswerText(t) { answerEl.classList.remove("markdown-body"); answerEl.textContent = t; }

    const form = document.getElementById("chat-form");
    const stopBtn = document.getElementById("stop-btn");
    const answerEl = document.getElementById("answer");
    const docRefsEl = document.getElementById("doc-refs");
    const attachedFilesEl = document.getElementById("attached-files");
    const downloadFilesEl = document.getElementById("download-files");
    const toolTraceEl = document.getElementById("tool-trace");
    const statusChip = document.getElementById("status-chip");
    const nodeChip = document.getElementById("node-chip");
    const memoryChip = document.getElementById("memory-chip");
    const threadChip = document.getElementById("thread-chip");
    const uploadBtn = document.getElementById("upload-btn");
    const clearFilesBtn = document.getElementById("clear-files-btn");
    const uploadInput = document.getElementById("upload_files");
    const searchMethodInputs = Array.from(document.querySelectorAll(".search-method"));

    let currentAbortController = null;
    const docRefSet = new Set();
    const downloadableFiles = new Map();
    const attachedFiles = new Map();

    function lineList(value) {
      return String(value || "")
        .split("\n")
        .map((item) => item.trim())
        .filter(Boolean);
    }

    function appendTrace(eventName, payload, isError = false) {
      const wrapper = document.createElement("div");
      wrapper.className = "event-item";

      const header = document.createElement("div");
      const extraClass = eventName === "node" ? "node" : "";
      header.className = `event-name ${isError ? "error" : ""} ${extraClass}`.trim();
      header.textContent = payload && payload.label ? payload.label : eventName;

      wrapper.appendChild(header);

      if (eventName === "agent_trace" || payload.message) {
        const body = document.createElement("div");
        body.className = "trace-message";
        body.textContent = payload.message || "";
        wrapper.appendChild(body);

        const metaParts = [];
        if (payload.agent) metaParts.push(`agent: ${payload.agent}`);
        if (payload.type) metaParts.push(`type: ${payload.type}`);
        if (payload.sequence) metaParts.push(`step: ${payload.sequence}`);
        if (metaParts.length) {
          const meta = document.createElement("div");
          meta.className = "trace-meta";
          meta.textContent = metaParts.join(" · ");
          wrapper.appendChild(meta);
        }
      } else if (eventName === "error" && payload.diagnosticText) {
        const body = document.createElement("div");
        body.className = "trace-message error";
        body.textContent = payload.error || "Stream error";
        wrapper.appendChild(body);
      } else {
        const body = document.createElement("pre");
        body.textContent = JSON.stringify(payload, null, 2);
        body.style.margin = "6px 0 0";
        body.style.whiteSpace = "pre-wrap";
        wrapper.appendChild(body);
      }
      toolTraceEl.appendChild(wrapper);
      toolTraceEl.scrollTop = toolTraceEl.scrollHeight;
    }

    /* Auth fails CLOSED server-side: a blank key against a protected server is a 403,
       and a server with no AGENT_CHAT_API_KEY configured is a 500. Both previously
       surfaced as a raw response body, which reads like a bug rather than a setting. */
    async function describeHttpError(resp) {
      const raw = await resp.text().catch(() => "");
      let detail = raw;
      try { const j = JSON.parse(raw); detail = j.error || j.message || raw; } catch (_) {}
      const keyed = !!document.getElementById("api_key").value.trim();
      if (resp.status === 403) {
        return keyed
          ? "403 — the API key was rejected. Check it matches AGENT_CHAT_API_KEY on the server."
          : "403 — this server requires an API key. Enter it in the API key field.";
      }
      if (resp.status === 500 && /misconfigur|api key not set/i.test(detail)) {
        return "500 — the server has no AGENT_CHAT_API_KEY configured, so it refuses requests. "
             + "Set it server-side, or set AGENT_CHAT_AUTH_OPTIONAL=1 for local development.";
      }
      return detail || `Request failed with status ${resp.status}`;
    }

    function apiKeyHeaders(includeJson = false) {
      const headers = {};
      if (includeJson) headers["Content-Type"] = "application/json";
      const apiKey = document.getElementById("api_key").value.trim();
      if (apiKey) headers["X-API-KEY"] = apiKey;
      return headers;
    }

    function normalizeRequestUrl(rawUrl, fallbackPath) {
      const value = String(rawUrl || "").trim();
      const base = window.location.protocol === "file:" ? "http://127.0.0.1:3500" : window.location.origin;
      if (value) {
        if (/^https?:\/\//i.test(value)) return value;
        return new URL(value, base).toString();
      }
      return new URL(fallbackPath, base).toString();
    }

    function renderDocRefs() {
      docRefsEl.innerHTML = "";
      const refs = Array.from(docRefSet).sort();
      if (!refs.length) {
        const li = document.createElement("li");
        li.className = "muted";
        li.textContent = "No document references emitted.";
        docRefsEl.appendChild(li);
        return;
      }
      for (const ref of refs) {
        const li = document.createElement("li");
        li.textContent = ref;
        docRefsEl.appendChild(li);
      }
    }

    function renderAttachedFiles() {
      attachedFilesEl.innerHTML = "";
      const items = Array.from(attachedFiles.values());
      if (!items.length) {
        const li = document.createElement("li");
        li.className = "muted";
        li.textContent = "No uploaded files attached.";
        attachedFilesEl.appendChild(li);
        return;
      }
      for (const file of items) {
        const li = document.createElement("li");
        const label = file.filename ? `${file.filename} (${file.file_id})` : file.file_id;
        li.textContent = label;
        attachedFilesEl.appendChild(li);
      }
    }

    function renderDownloadFiles() {
      downloadFilesEl.innerHTML = "";
      const items = Array.from(downloadableFiles.values());
      if (!items.length) {
        const li = document.createElement("li");
        li.className = "muted";
        li.textContent = "No downloadable files produced.";
        downloadFilesEl.appendChild(li);
        return;
      }
      for (const file of items) {
        const li = document.createElement("li");
        const link = document.createElement("a");
        link.href = absoluteUrl(file.download_url);
        link.textContent = file.filename || file.file_id || "download";
        link.target = "_blank";
        link.rel = "noreferrer";
        li.appendChild(link);
        if (file.file_id) {
          li.appendChild(document.createTextNode(` (${file.file_id})`));
        }
        downloadFilesEl.appendChild(li);
      }
    }

    function apiBase() {
      // Resolve download/file links against the CONFIGURED API server (which may be
      // remote), not the page's own origin. Derive the origin from the endpoint
      // fields; fall back to localhost (file://) or the page origin.
      const candidates = [
        document.getElementById("endpoint") && document.getElementById("endpoint").value,
        document.getElementById("upload_endpoint") && document.getElementById("upload_endpoint").value,
      ];
      for (const raw of candidates) {
        const v = String(raw || "").trim();
        if (/^https?:\/\//i.test(v)) {
          try { return new URL(v).origin; } catch (e) {}
        }
      }
      return window.location.protocol === "file:" ? "http://127.0.0.1:3500" : window.location.origin;
    }

    function absoluteUrl(path) {
      if (!path) return "#";
      let p = String(path).trim().replace(/^sandbox:/i, ""); // models sometimes emit sandbox:/agent/files/...
      if (/^https?:\/\//i.test(p)) return p;
      try { return new URL(p, apiBase()).toString(); } catch (e) { return "#"; }
    }

    function maybeCollectRefs(value) {
      if (!value) return;

      if (Array.isArray(value)) {
        value.forEach(maybeCollectRefs);
        return;
      }

      if (typeof value === "string") {
        try {
          maybeCollectRefs(JSON.parse(value));
          return;
        } catch (_) {
          return;
        }
      }

      if (typeof value !== "object") return;

      if (Array.isArray(value.citation_ids)) {
        value.citation_ids.forEach((id) => docRefSet.add(String(id)));
      }
      if (typeof value.doc_id === "string" && value.doc_id) {
        docRefSet.add(value.doc_id);
      }
      if (Array.isArray(value.documents)) {
        value.documents.forEach((doc) => {
          if (doc && typeof doc.doc_id === "string" && doc.doc_id) {
            docRefSet.add(doc.doc_id);
          }
        });
      }

      Object.values(value).forEach(maybeCollectRefs);
    }

    function maybeCollectDownloads(value) {
      if (!value) return;

      if (Array.isArray(value)) {
        value.forEach(maybeCollectDownloads);
        return;
      }

      if (typeof value === "string") {
        try {
          maybeCollectDownloads(JSON.parse(value));
          return;
        } catch (_) {
          return;
        }
      }

      if (typeof value !== "object") return;

      if (value.download_url && (value.file_id || value.filename)) {
        const key = String(value.file_id || value.download_url);
        downloadableFiles.set(key, {
          file_id: value.file_id || "",
          filename: value.filename || "download",
          download_url: value.download_url
        });
      }

      Object.values(value).forEach(maybeCollectDownloads);
    }

    function buildPayload() {
      const recentKValue = document.getElementById("recent_k").value.trim();
      return {
        user_input: document.getElementById("user_input").value.trim(),
        memory_id: document.getElementById("memory_id").value.trim() || null,
        thread_id: document.getElementById("thread_id").value.trim() || null,
        conversation_name: document.getElementById("conversation_name").value.trim() || null,
        recent_k: recentKValue === "" ? null : Number(recentKValue),
        tool_strategy: document.getElementById("tool_strategy").value,
        include_mcp_tools: document.getElementById("include_mcp_tools").checked,
        mcp_modules: lineList(document.getElementById("mcp_modules").value.replaceAll(",", "\n")),
        enabled_search_methods: searchMethodInputs.filter((input) => input.checked).map((input) => input.value),
        use_persistent_memory: document.getElementById("use_persistent_memory").checked,
        smart_tool_routing: document.getElementById("smart_tool_routing").checked,
        forced_intent: document.getElementById("forced_intent").value || null,
        file_ids: Array.from(attachedFiles.keys()),
        verbose: document.getElementById("verbose").checked,
        agent_dev: document.getElementById("agent_dev").checked,
        use_supervisor: document.getElementById("use_supervisor").checked,
        code_exec: document.getElementById("code_exec").checked
      };
    }

    async function streamRequest(url, payload) {
      currentAbortController = new AbortController();
      const requestUrl = normalizeRequestUrl(url, "/agent/chat/stream");
      statusChip.textContent = "connecting";
      memoryChip.textContent = `memory: ${payload.memory_id || "auto"}`;
      threadChip.textContent = `thread: ${payload.thread_id || "auto"}`;
      setAnswerText("Waiting for streamed events...");
      docRefSet.clear();
      downloadableFiles.clear();
      renderDocRefs();
      renderDownloadFiles();
      toolTraceEl.innerHTML = "";

      appendTrace("request_start", {
        label: "POST /agent/chat/stream",
        message: `Sending request to ${requestUrl}`
      });
      console.info("Agent chat stream request", requestUrl, payload);

      const response = await fetch(requestUrl, {
        method: "POST",
        headers: apiKeyHeaders(true),
        body: JSON.stringify(payload),
        signal: currentAbortController.signal
      });

      appendTrace("request_response", {
        label: "HTTP response",
        message: `${response.status} ${response.statusText || ""}`.trim()
      }, !response.ok);

      if (!response.ok || !response.body) {
        throw new Error(await describeHttpError(response));
      }

      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });

        let boundary = buffer.indexOf("\n\n");
        while (boundary !== -1) {
          const rawEvent = buffer.slice(0, boundary);
          buffer = buffer.slice(boundary + 2);
          handleSseBlock(rawEvent);
          boundary = buffer.indexOf("\n\n");
        }
      }

      if (buffer.trim()) {
        handleSseBlock(buffer);
      }
    }

    function handleSseBlock(block) {
      if (!block.trim()) return;
      const lines = block.split("\n");
      let eventName = "message";
      const dataLines = [];

      for (const line of lines) {
        if (line.startsWith("event:")) {
          eventName = line.slice(6).trim();
        } else if (line.startsWith("data:")) {
          dataLines.push(line.slice(5).trim());
        }
      }

      let payload = {};
      const rawData = dataLines.join("\n");
      if (rawData) {
        try {
          payload = JSON.parse(rawData);
        } catch (_) {
          payload = { raw: rawData };
        }
      }

      maybeCollectRefs(payload);
      maybeCollectDownloads(payload);
      renderDocRefs();
      renderDownloadFiles();
      appendTrace(eventName, payload, eventName === "error");

      if (eventName === "node") {
        const stage = payload.stage || payload.node || "node";
        const done = payload.type === "node_completed";
        nodeChip.textContent = `node: ${stage}${done ? " ✓" : " …"}`;
        if (payload.message) {
          statusChip.textContent = payload.message;
        }
      }
      if (eventName === "status" && payload.status) {
        statusChip.textContent = payload.status;
      }
      if (eventName === "routing" && payload.type === "route_trace") {
        const detail = payload.detail || {};
        statusChip.textContent = `route: ${detail.intent || "unknown"}`;
      }
      if (eventName === "answer") {
        const text = payload.answer || payload.final_answer;
        if (text) {
          setAnswerMarkdown(text);
          statusChip.textContent = "completed";
        }
      }
      if (eventName === "result") {
        if (payload.answer) {
          setAnswerMarkdown(payload.answer);
        }
        if (payload.threadId) {
          threadChip.textContent = `thread: ${payload.threadId}`;
          // Reuse the same thread/memory on the next turn so conversation memory persists.
          document.getElementById("thread_id").value = payload.threadId;
        }
        if (payload.memoryId) {
          memoryChip.textContent = `memory: ${payload.memoryId}`;
          document.getElementById("memory_id").value = payload.memoryId;
        }
        statusChip.textContent = "completed";
      }
      if (eventName === "error") {
        statusChip.textContent = "error";
        if (payload.error) {
          setAnswerText(payload.error);
        }
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (currentAbortController) {
        currentAbortController.abort();
      }

      try {
        const payload = buildPayload();
        const endpoint = document.getElementById("endpoint").value.trim();
        await streamRequest(endpoint, payload);
      } catch (error) {
        statusChip.textContent = "error";
        const message = String(error.message || error);
        setAnswerText(message);
        appendTrace("client_error", {
          label: "Client error",
          message,
          hint: "If the Flask terminal shows no request, verify the endpoint host/port. This page falls back to 127.0.0.1:3500 when opened as file://."
        }, true);
      } finally {
        currentAbortController = null;
      }
    });

    // Enter submits (Start Stream); Shift+Enter keeps a newline in the query box.
    form.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey && !event.isComposing) {
        event.preventDefault();
        form.requestSubmit();
      }
    });

    stopBtn.addEventListener("click", () => {
      if (currentAbortController) {
        currentAbortController.abort();
        currentAbortController = null;
        statusChip.textContent = "stopped";
      }
    });

    uploadBtn.addEventListener("click", async () => {
      const files = Array.from(uploadInput.files || []);
      if (!files.length) {
        appendTrace("upload_error", { message: "No files selected." }, true);
        return;
      }

      const formData = new FormData();
      files.forEach((file) => formData.append("files", file));

      try {
        const uploadUrl = normalizeRequestUrl(
          document.getElementById("upload_endpoint").value.trim(),
          "/agent/files/upload"
        );
        appendTrace("upload_start", {
          label: "POST /agent/files/upload",
          message: `Uploading ${files.length} file(s) to ${uploadUrl}`
        });
        console.info("Agent file upload request", uploadUrl, files.map((file) => file.name));
        const response = await fetch(uploadUrl, {
          method: "POST",
          headers: apiKeyHeaders(false),
          body: formData
        });
        const payload = await response.json();
        if (!response.ok) {
          throw new Error(payload.error || `Upload failed with status ${response.status}`);
        }
        for (const file of payload.files || []) {
          attachedFiles.set(String(file.file_id), file);
          downloadableFiles.set(String(file.file_id), file);
        }
        renderAttachedFiles();
        renderDownloadFiles();
        appendTrace("upload_complete", payload);
        uploadInput.value = "";
      } catch (error) {
        appendTrace("upload_error", { message: String(error.message || error) }, true);
      }
    });

    clearFilesBtn.addEventListener("click", () => {
      attachedFiles.clear();
      renderAttachedFiles();
    });

    renderDocRefs();
    renderAttachedFiles();
    renderDownloadFiles();

    window.addEventListener("error", (event) => {
      appendTrace("client_error", {
        label: "Client error",
        message: event.message || "Unhandled browser error"
      }, true);
    });

    window.addEventListener("unhandledrejection", (event) => {
      appendTrace("client_error", {
        label: "Client error",
        message: String((event.reason && event.reason.message) || event.reason || "Unhandled promise rejection")
      }, true);
    });
  </script>
</body>
</html>
