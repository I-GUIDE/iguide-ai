name: publish-images

# Builds the docker-compose service images and pushes them to GHCR on every push to snapshot,
# the branch the deployment runs. A deployment then pulls instead of building, and never needs
# the source or a token:
#
#   snapshot -> ghcr.io/<owner>/iguide-ai-<image>:staging   (+ :staging-<sha>)
#
# The moving tag (staging) is what a deployment follows. The -<sha> tag pins the exact commit,
# so a rollback is a tag change, not a rebuild.

on:
  push:
    branches: [snapshot]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# A newer push supersedes an in-flight build: only the latest commit should end up behind the
# moving tag.
concurrency:
  group: publish-images-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  publish:
    # A manual run from another branch would otherwise publish that branch as staging.
    if: github.ref_name == 'snapshot'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # Same build context and Dockerfiles as docker-compose.yml.
          - image: agent-api
            dockerfile: rag_pipeline/Dockerfile
          - image: mcp-server
            dockerfile: MCP_server/Dockerfile
          - image: embedding-server
            dockerfile: embedding-server/Dockerfile
          - image: metadata-extraction-server
            dockerfile: metadata-extraction-server/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image name
        id: target
        # GHCR rejects upper-case repository names, and the owner is I-GUIDE.
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/iguide-ai-${{ matrix.image }}" >> "$GITHUB_OUTPUT"

      - name: Free runner disk space
        # agent-api carries GDAL, QGIS and spaCy models; the stock runner's free space is not
        # enough to build and export it alongside the preinstalled toolchains.
        if: matrix.image == 'agent-api'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.target.outputs.name }}
          tags: |
            type=raw,value=staging
            type=sha,prefix=staging-

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          # The deployment hosts are x86-64.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
