name: verify

# The test suite, run where the deployment runs: Linux x86-64, CPython 3.11 (rag_pipeline/
# Dockerfile is python:3.11-slim) and, the part that matters most, the package versions the
# deployed image actually has.
#
# Until this workflow the suite had never run in a clean Linux / Python 3.11 environment, only on
# the development Mac, which hides platform failures: ~/.local there supplies packages a clean
# install lacks, and arm64 rounds floating point differently from x86-64.
#
# No secrets, and none should be added. rag_pipeline/tests/conftest.py replaces dotenv's loader
# with a no-op, and nothing here sets RUN_LIVE_BACKEND_TESTS, so the suite runs offline.
#
# The file is named like origin/backend_swap's on purpose. If that branch merges, the two
# conflict and get reconciled into one, instead of two workflows both running the suite.

on:
  push:
    branches: [prototype]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    # A comparable install and a larger suite took under three minutes on a sibling branch. The
    # cap is for a test that blocks on the network instead of failing; without one GitHub waits
    # six hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints.txt

      - name: Install the deployed image's versions
        # requirements.txt names packages, not versions. Installed bare, it tests
        # latest-at-run-time: a stack that changes with every upstream release and is not the
        # one deployed. constraints.txt is the deployed image's own `pip freeze`; its header
        # says when it was taken and how to retake it. pip itself is upgraded because it is the
        # installer, not part of what is deployed, and everything it installs is pinned.
        run: |
          python3 -c "import platform, sys; print(sys.version, platform.machine()); assert sys.version_info[:2] == (3, 11), sys.version"
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt -c constraints.txt

      - name: Report anything installed at a version the deployed image does not have
        # A constraint only binds what requirements.txt asks for. A line printed here is a
        # package at a version constraints.txt does not list, normally a requirement added since
        # the freeze, which therefore floated to latest. A warning, not a failure: until the next
        # deploy there is no deployed version to pin it to. Retake constraints.txt after it.
        run: |
          drift=$(python3 -m pip freeze | grep -vxFf constraints.txt || true)
          if [ -n "$drift" ]; then
            echo "$drift"
            echo "::warning title=Not the deployed version::$(echo "$drift" | tr '\n' ' ')"
          else
            echo "all $(python3 -m pip freeze | wc -l) installed packages are at the deployed version"
          fi

      - name: Import what the tests importorskip, so a missing package fails instead of skipping
        # Most spatial test modules open with pytest.importorskip("geopandas"), ("libpysal") and
        # the like, which SKIPS when the module is absent. A package dropped from the install
        # would turn those modules into skips and leave this job green with far fewer tests.
        # (One present but unloadable, e.g. a wheel missing a system library, already errors at
        # collection under pytest 9.) These are the importorskip targets in rag_pipeline/tests
        # plus the version-sensitive core; their versions print too.
        run: |
          python3 - <<'PY'
          import importlib
          for name in ("numpy", "pandas", "scipy", "shapely", "pyproj", "pyogrio", "fiona",
                       "rasterio", "geopandas", "libpysal", "esda", "spreg", "pygeoda",
                       "matplotlib", "sklearn", "tiktoken", "langchain_core"):
              module = importlib.import_module(name)
              print(f"{name:15s} {getattr(module, '__version__', '?')}")
          PY

      - name: Fetch the tiktoken encoding the estimator test reads
        # The suite downloads nothing: test_context_budget.py reads o200k_base from tiktoken's
        # cache and skips when it is not there. A fresh runner has no cache, so without this step
        # that test would skip on every run. A failed fetch fails here instead of becoming a skip.
        run: python3 -c "import tiktoken; tiktoken.get_encoding('o200k_base')"

      - name: Run the test suite
        # `python3 -m pytest` is the documented command (AGENTS.md). Unlike bare `pytest`, -m
        # also puts the repo root on sys.path. -rfEs adds skip reasons to the summary, so a test
        # that skips here for want of something the image has is visible as a skip.
        run: python3 -m pytest rag_pipeline/tests/ -q -rfEs

  deployment-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # python-dotenv because pytest imports rag_pipeline/tests/conftest.py as part of the
      # `rag_pipeline` package, and rag_pipeline/__init__.py imports dotenv at module scope.
      # Without it the job dies collecting conftest, before a single assertion runs.
      # networkx because three contract tests pin the graph stack, one of them asserting the
      # INSTALLED version equals constraints.txt — so it is installed through the lock, not loose.
      - run: pip install pytest pyyaml python-dotenv networkx -c constraints.txt
      - name: Assert the deployed configuration is safe
        # These are security boundaries, not preferences:
        #   - LLM_PROVIDER=claude-cli routes through a personal subscription
        #   - AGENT_ALLOW_WORKFLOW_EXEC exec()s ingested notebook source in a credentialed process
        run: pytest rag_pipeline/tests/test_deployment_contract.py -q

  artifact-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build the sandbox image
        run: docker build -t iguide-codeexec:ci sandbox/

      - name: Resolve the image DIGEST
        # A tag is not a pin. `python:3.11-slim` resolves to different bytes next month, so an
        # artifact recording a tag records nothing about the environment that produced its number.
        id: digest
        run: |
          DIGEST=$(docker image inspect iguide-codeexec:ci --format '{{.Id}}')
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "pinned to $DIGEST"

      - name: The image must import its geospatial stack with NO network
        # The sandbox runs --network none. A wheel that installs cleanly and then fails at import
        # makes a successful build prove nothing — this is exactly how a missing libexpat.so.1
        # shipped past a green build once already.
        run: |
          docker run --rm --network none iguide-codeexec:ci python -c "
          import geopandas, rasterio, pyproj
          from shapely.geometry import Point
          g = geopandas.GeoDataFrame({'a': [1]}, geometry=[Point(-87.6, 41.9)],
                                     crs='EPSG:4326').to_crs(32616)
          assert g.crs.axis_info[0].unit_name == 'metre'
          assert pyproj.CRS.from_epsg(3435).axis_info[0].unit_name == 'US survey foot'
          area = g.buffer(25000).area.iloc[0] / 1e6
          assert 1955 < area < 1965, area
          print('geospatial stack OK offline; 25km buffer =', round(area, 2), 'km2')
          "

      - name: The invariant gate must catch a geographic-CRS measurement
        # The gate's whole purpose. If this passes silently, every downstream 'verified' claim is
        # worthless, and nothing else in CI would notice.
        run: |
          pip install -r requirements.txt -c constraints.txt
          python - <<'PY'
          import json, subprocess, sys, tempfile
          from pathlib import Path
          from agent_runtime.sandbox_verify import prologue_source, epilogue_source

          WRONG = """
          import geopandas as gpd
          from shapely.geometry import Point
          gdf = gpd.GeoDataFrame({'a': [1]}, geometry=[Point(-87.6, 41.9)], crs='EPSG:4326')
          gdf['area_km2'] = gdf.buffer(25000).area / 1e6     # 25000 DEGREES
          """
          RIGHT = WRONG.replace("crs='EPSG:4326')", "crs='EPSG:4326').to_crs(32616)")

          for label, body, expected in (("degrees buffer", WRONG, "fail"),
                                        ("reprojected", RIGHT, "pass")):
              with tempfile.TemporaryDirectory() as d:
                  Path(d, "run.py").write_text(
                      prologue_source(None) + body + epilogue_source(), encoding="utf-8")
                  subprocess.run([sys.executable, "run.py"], cwd=d, capture_output=True)
                  report = json.loads(Path(d, "checks.json").read_text())
                  assert "error" not in report, report["error"]
                  assert report["verdict"] == expected, f"{label}: {report['verdict']}"
                  print(f"  {label}: {report['verdict']}")
          PY

      - name: Replay a recorded artifact, if one is committed
        # Skipped rather than failed when there is no fixture: a missing artifact is not a
        # regression, and a job that fails for being empty gets disabled.
        run: |
          if [ -d outputs ] && ls outputs/*/artifact/manifest.json >/dev/null 2>&1; then
            for a in outputs/*/artifact; do
              echo "replaying $a"
              python scripts/rerun_artifact.py "$a"
            done
          else
            echo "no committed artifact fixture; skipping replay"
          fi
